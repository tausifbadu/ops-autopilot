[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-autopilot-agent-host"
version = "0.1.0"
description = "Agent Host for ops-autopilot - orchestrates workflows and agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "boto3>=1.28.0",
    "ops-autopilot-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["agent_host"]

[tool.setuptools.package-dir]
"" = "src"
