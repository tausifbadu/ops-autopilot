version: '3.8'

services:
  orchestration-sfn:
    build:
      context: ./mcp-servers/orchestration-sfn
      dockerfile: Dockerfile
    container_name: mcp-orchestration-sfn
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - ALLOWLIST_ENABLED=${ALLOWLIST_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount AWS credentials if using local credentials file
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - ops-autopilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  devtools-github:
    build:
      context: ./mcp-servers/devtools-github
      dockerfile: Dockerfile
    container_name: mcp-devtools-github
    ports:
      - "8007:8007"
    environment:
      - HOST=0.0.0.0
      - PORT=8007
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_API_URL=${GITHUB_API_URL:-https://api.github.com}
      - ALLOWLIST_ENABLED=${ALLOWLIST_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - ops-autopilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  observability-cloudwatch:
    build:
      context: ./mcp-servers/observability-cloudwatch
      dockerfile: Dockerfile
    container_name: mcp-observability-cloudwatch
    ports:
      - "8002:8002"
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - ALLOWLIST_ENABLED=${ALLOWLIST_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount AWS credentials if using local credentials file
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - ops-autopilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  data-execution-glue-emr:
    build:
      context: ./mcp-servers/data-execution-glue-emr
      dockerfile: Dockerfile
    container_name: mcp-data-execution-glue-emr
    ports:
      - "8003:8003"
    environment:
      - HOST=0.0.0.0
      - PORT=8003
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - ALLOWLIST_ENABLED=${ALLOWLIST_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount AWS credentials if using local credentials file
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - ops-autopilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ops-autopilot-network:
    driver: bridge
